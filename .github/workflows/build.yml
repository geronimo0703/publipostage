name: Build des exécutables (Windows / Ubuntu)

# Se déclenche uniquement quand tu pousses un tag de version, ex. :
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Générer le .env.default depuis les secrets GitHub
        shell: python
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          import os
          from pathlib import Path
          Path("config").mkdir(parents=True, exist_ok=True)
          Path("config/.env.default").write_text(
              f"SMTP_USER={os.environ['SMTP_USER']}\n"
              f"SMTP_PASSWORD={os.environ['SMTP_PASSWORD']}\n"
              f"SMTP_SERVER={os.environ['SMTP_SERVER']}\n"
              f"SMTP_PORT={os.environ['SMTP_PORT']}\n"
          )

      - name: Construire l'exécutable avec PyInstaller
        run: pyinstaller publipostage.spec

      # Sur Windows le binaire s'appelle publipostage.exe, sur Linux publipostage.
      # On renomme pour inclure l'OS dans le nom de fichier livré, pour
      # que les deux binaires de la même release ne se marchent pas dessus.
      - name: Renommer l'exécutable (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          mv publipostage publipostage-linux

      - name: Renommer l'exécutable (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          mv publipostage.exe publipostage-windows.exe

      - name: Publier l'exécutable comme artifact du build
        uses: actions/upload-artifact@v4
        with:
          name: publipostage-${{ runner.os }}
          path: |
            dist/publipostage-linux
            dist/publipostage-windows.exe
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer tous les artifacts de build
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Créer la release GitHub avec les deux binaires
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publipostage-Linux/publipostage-linux
            artifacts/publipostage-Windows/publipostage-windows.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
