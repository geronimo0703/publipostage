name: Build des exécutables (Windows / Ubuntu)

# Se déclenche uniquement quand tu pousses un tag de version, ex. :
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 plutôt que ubuntu-latest : on build avec une glibc
        # plus ancienne pour rester compatible avec des machines volontaires
        # qui n'ont pas forcément la toute dernière version d'Ubuntu/Debian.
        # Un binaire lié à une glibc récente ne tourne PAS sur une glibc
        # plus ancienne (incompatibilité à sens unique), donc on vise large.
        os: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Générer le .env.default depuis les secrets GitHub
        shell: python
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          import os
          from pathlib import Path
          Path("config").mkdir(parents=True, exist_ok=True)
          Path("config/.env.default").write_text(
              f"SMTP_USER={os.environ['SMTP_USER']}\n"
              f"SMTP_PASSWORD={os.environ['SMTP_PASSWORD']}\n"
              f"SMTP_SERVER={os.environ['SMTP_SERVER']}\n"
              f"SMTP_PORT={os.environ['SMTP_PORT']}\n"
          )
      - name: Write version file
        run: echo "${{ github.ref_name }}" > VERSION
        shell: bash

      - name: Construire l'exécutable avec PyInstaller
        run: pyinstaller publipostage.spec

      # Sur Windows le binaire s'appelle publipostage.exe, sur Linux publipostage.
      # On constitue un dossier "livraison" avec l'exe + son script de
      # raccourci Bureau correspondant, puis on zippe le tout : le
      # volontaire télécharge un seul fichier, l'extrait, lance le script
      # une fois, et a son icône sur le Bureau.
      - name: Préparer le paquet Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp dist/publipostage package/publipostage-linux
          cp installer/creer_raccourci_linux.sh package/
          chmod +x package/publipostage-linux package/creer_raccourci_linux.sh
          cd package && zip -r ../publipostage-linux.zip .

      - name: Préparer le paquet Windows
        if: runner.os == 'Windows'
        run: |
          mkdir package
          copy dist\publipostage.exe package\publipostage-windows.exe
          copy installer\creer_raccourci_windows.ps1 package\
          Compress-Archive -Path package\* -DestinationPath publipostage-windows.zip
        shell: pwsh

      - name: Publier le paquet comme artifact du build
        uses: actions/upload-artifact@v4
        with:
          name: publipostage-${{ runner.os }}
          path: |
            publipostage-linux.zip
            publipostage-windows.zip
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer tous les artifacts de build
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Créer la release GitHub avec les deux paquets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publipostage-Linux/publipostage-linux.zip
            artifacts/publipostage-Windows/publipostage-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
